name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static_analysis:
    name: lint + security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ruby

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Cache bundler-audit advisory DB
        uses: actions/cache@v5
        with:
          path: ~/.local/share/ruby-advisory-db
          key: ruby-advisory-db-${{ github.run_id }}
          restore-keys: ruby-advisory-db-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  test:
    name: unit + system tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ruby

      - name: Run unit + system tests
        run: bin/rails db:test:prepare test test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm run test

  solver:
    name: solver suites (pytest + benchmark scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Force single-worker CP-SAT for deterministic test runs.
      # Parallel CP-SAT search is non-deterministic across runs even
      # with a fixed seed and would make the benchmark suites flaky.
      SOLVER_NUM_WORKERS: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: solver_service/requirements.txt

      - name: Install solver dependencies
        working-directory: solver_service
        run: pip install -r requirements.txt

      - name: Run solver test suites with coverage (including slow scenarios)
        working-directory: solver_service
        run: |
          python -m pytest tests/ --run-slow -v \
            --cov=solver --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-coverage
          path: solver_service/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      SECRET_KEY_BASE: dummycisecretkeybasefortestingonly00000000000000000000000000000000000000000
      PLAYWRIGHT_SKIP_SEED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ruby
      - uses: ./.github/actions/setup-node

      - name: Cache Vite test build
        uses: actions/cache@v5
        id: vite-cache
        with:
          path: public/vite-test
          key: vite-test-${{ runner.os }}-${{ hashFiles('app/frontend/**', 'vite.config.ts', 'package-lock.json', 'tsconfig.json', 'tailwind.config.*', 'postcss.config.*') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Build Vite assets for test
        if: steps.vite-cache.outputs.cache-hit != 'true'
        run: bin/vite build --mode test

      - name: Seed Playwright users
        run: bin/rails playwright:seed_all

      - name: Start Rails server
        run: |
          bundle exec rails server -p 3000 -b 0.0.0.0 > /tmp/rails-server.log 2>&1 &
          echo $! > /tmp/rails-server.pid
          if ! curl --silent --fail --retry 60 --retry-delay 1 --retry-all-errors --retry-connrefused --output /dev/null http://localhost:3000/up; then
            echo "Rails failed to start"
            tail -80 /tmp/rails-server.log
            exit 1
          fi
          echo "Rails is up"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Stop Rails server
        if: always()
        run: |
          if [ -f /tmp/rails-server.pid ]; then kill "$(cat /tmp/rails-server.pid)" || true; fi

      - name: Upload Rails server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rails-server-log
          path: /tmp/rails-server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
