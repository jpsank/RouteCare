# Railway configuration for RouteCare (Rails app at repo root).
# Docs: https://docs.railway.com/reference/config-as-code
#
# Monorepo — Python solver:
#   1. In the same Railway project, add a service from this repo.
#   2. Settings → Root Directory: solver_service
#   3. Settings → Config-as-code: /solver_service/railway.toml
#   4. Deploy; add a public domain for the solver if Rails will call it over HTTPS.
#   5. On this Rails service: PYTHON_SOLVER_URL=https://<solver-host> (no trailing path; client uses /solve)
#
# https://docs.railway.com/guides/monorepo

[build]
# Railway auto-detects the Dockerfile. Skip deploys when only solver_service/ changes.
# Repo-root–relative patterns: https://docs.railway.com/builds/build-configuration#configure-watch-paths
watchPatterns = [
  "/app/**",
  "/bin/**",
  "/config/**",
  "/db/**",
  "/docs/**",
  "/lib/**",
  "/public/**",
  "/storage/**",
  "/test/**",
  "/tmp/**",
  "/vendor/**",
  "/.github/**",
  "/Gemfile",
  "/Gemfile.lock",
  "/package.json",
  "/package-lock.json",
  "/Dockerfile",
  "/Rakefile",
  "/config.ru",
  "/.ruby-version",
  "/railway.toml",
  "/render.yaml",
  "/vite.config.ts",
  "/tsconfig.json",
  "/tailwind.config.cjs",
  "/postcss.config.cjs",
]

[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
